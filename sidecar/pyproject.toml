[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pod-cutout-sidecar"
version = "0.1.0"
description = "Local-only image coordinator for Local POD Cutout Editor"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cutout_sidecar*"]


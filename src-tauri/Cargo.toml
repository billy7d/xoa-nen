[package]
name = "local-pod-cutout-editor"
version = "0.1.0"
description = "Local pixel-accurate POD cutout editor"
authors = ["Local POD Cutout Editor contributors"]
edition = "2021"

[lib]
name = "local_pod_cutout_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
